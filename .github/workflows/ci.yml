name: Test lint and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the current version from main after all checks pass'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never interrupt an upload or publication because another main push arrives.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    timeout-minutes: 25
    steps:
      - name: Install test and package dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates curl git build-essential shellcheck shfmt bats jq python3 apt-utils gnupg util-linux ufw debhelper pkg-config libgtk-4-dev libadwaita-1-dev libjson-glib-dev desktop-file-utils libxml2-utils appstream xvfb xauth dbus-daemon adwaita-icon-theme librsvg2-common
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Lint, compile and test CLI and native interface
        run: |
          # The container runs as root while checkout files are runner-owned.
          # Trust only this workflow's exact checkout, never a wildcard path.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          make check ui-test
          bash scripts/version.sh --check
          bash tests/package.sh
      - name: Verify actual UFW vendor hooks without activating protection
        run: bash tests/ufw-vendor.sh
      - name: Test native windows and asynchronous operations
        run: make ui-display-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: native-ui-screenshots-ubuntu-${{ matrix.ubuntu }}
          path: |
            build/ui-*.png
            build/screenshots/*.png
          if-no-files-found: ignore
      - name: Assemble versioned application assets
        run: |
          mkdir -p dist
          bash scripts/release-assets.sh dist/release-assets
          version=$(dpkg-parsechangelog -S Version)
          tar -C dist -czf "dist/octoshield-assets-${version}.tar.gz" release-assets
          cd dist
          sha256sum octoshield-assets-*.tar.gz > SHA256SUMS-assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.ubuntu == '24.04'
        with:
          name: octoshield-release-assets
          path: |
            dist/release-assets/
            dist/octoshield-assets-*.tar.gz
            dist/SHA256SUMS-assets
          if-no-files-found: error
          retention-days: 30
      - name: Check C memory and undefined behavior
        run: make sanitize
      - name: Run user-session fixtures and native app without root
        run: |
          useradd --create-home octoshield-test
          chmod -R a+rX "$GITHUB_WORKSPACE"
          runuser -u octoshield-test -- bats tests/desktop.bats tests/user-api.bats
          runuser -u octoshield-test -- dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo build/octoshield-gtk --smoke-test
      - name: Build and inspect Debian archive
        run: |
          dpkg-buildpackage -us -uc -b
          version=$(dpkg-parsechangelog -S Version)
          bash tests/package.sh "../octoshield_${version}_amd64.deb"
      - name: Verify actual install, upgrade and removal in disposable container
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          version=$(dpkg-parsechangelog -S Version)
          baseline="octoshield_1.1.0_ubuntu${UBUNTU_VERSION}_amd64.deb"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --connect-timeout 10 --max-time 120 \
            "https://github.com/octoleo/octoshield/releases/download/v1.1.0/$baseline" --output "/tmp/$baseline"
          case "$UBUNTU_VERSION" in
            24.04) baseline_sha=6202f446aaa81b7ce0a41fd902ec7b27766f57ee1d04591e45947ad01630d6b0 ;;
            26.04) baseline_sha=696ac2650e4b9d3d490740d68548614f882ca317fd1af5e6a69d412d6fdfc634 ;;
          esac
          printf '%s  %s\n' "$baseline_sha" "/tmp/$baseline" | sha256sum --check
          bash tests/package-lifecycle.sh --disposable-system "../octoshield_${version}_amd64.deb" "/tmp/$baseline"
      - name: Prepare downloadable artifacts
        env:
          UBUNTU_VERSION: ${{ matrix.ubuntu }}
        run: |
          mkdir -p dist
          version=$(dpkg-parsechangelog -S Version)
          cp "../octoshield_${version}_amd64.deb" "dist/octoshield_${version}_ubuntu${UBUNTU_VERSION}_amd64.deb"
          cd dist
          sha256sum *.deb > "SHA256SUMS-ubuntu${UBUNTU_VERSION}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: octoshield-ubuntu-${{ matrix.ubuntu }}-amd64
          path: |
            dist/*.deb
            dist/SHA256SUMS-ubuntu*
          if-no-files-found: error
          retention-days: 30

  apt-repository:
    name: Verify APT update repository
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install repository tooling
        run: sudo apt-get install --yes --no-install-recommends apt-utils gnupg appstream jq
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: octoshield-ubuntu-*-amd64
          path: packages
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: octoshield-release-assets
          path: assets
      - name: Build inspectable repository without publishing credentials
        run: bash scripts/apt-repository.sh --input packages --assets assets/release-assets --output apt-test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: octoshield-apt-repository-test
          path: apt-test/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish versioned Debian packages
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish)
    needs: [check, apt-repository]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: octoshield-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.publish.outputs.tag }}
      available: ${{ steps.publish.outputs.available }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify current main before running publication code
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if test "$(git rev-parse HEAD)" != "$main_sha"; then
            echo 'Publication skipped: this run is no longer the current main commit.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version=$(bash scripts/version.sh)
          if test "$GITHUB_REF_TYPE" = tag; then
            bash scripts/version.sh --check "$GITHUB_REF_NAME"
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo 'current=true' >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.gate.outputs.current == 'true'
        with:
          pattern: octoshield-ubuntu-*-amd64
          path: release
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        if: steps.gate.outputs.current == 'true'
        with:
          name: octoshield-release-assets
          path: assets
      - name: Publish packages, screenshots and application assets
        id: publish
        if: steps.gate.outputs.current == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.gate.outputs.tag }}
        run: |
          bash scripts/publish-release.sh "$RELEASE_TAG" "$(git rev-parse HEAD)" release assets

  apt-publish:
    name: Publish signed APT updates (optional)
    if: needs.release.outputs.available == 'true' && vars.APT_PUBLISH_ENABLED == 'true'
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: octoshield-apt-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify reviewed current release before accessing signing material
        id: release-gate
        env:
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
          main_sha=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq '.object.sha')
          if test "$(git rev-parse HEAD)" != "$main_sha"; then
            echo 'APT publishing skipped: a newer main commit is available.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          main_version=$(git show refs/remotes/origin/main:src/octoshield | sed -n 's/^readonly OCTOSHIELD_VERSION=//p')
          if test "$RELEASE_TAG" != "v$main_version"; then
            echo 'APT publishing skipped: this is no longer the version on main.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          bash scripts/version.sh --check "$RELEASE_TAG"
          echo 'current=true' >> "$GITHUB_OUTPUT"
      - name: Check optional signing configuration
        id: configuration
        if: steps.release-gate.outputs.current == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_FINGERPRINT: ${{ vars.APT_SIGNING_KEY_FINGERPRINT }}
          APT_REPOSITORY_URL: ${{ vars.APT_REPOSITORY_URL }}
        run: |
          if test -z "$APT_SIGNING_KEY" || test -z "$APT_SIGNING_KEY_FINGERPRINT" || test -z "$APT_REPOSITORY_URL"; then
            echo 'APT publishing skipped: signing key, fingerprint and public URL must all be configured.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Install signing and catalogue tooling
        if: steps.configuration.outputs.configured == 'true'
        run: sudo apt-get install --yes --no-install-recommends apt-utils gnupg appstream jq
      - name: Download the published release for APT distribution
        if: steps.configuration.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: |
          mkdir packages assets
          gh release download "$RELEASE_TAG" --dir packages --pattern '*.deb' --pattern 'SHA256SUMS-ubuntu*'
          gh release download "$RELEASE_TAG" --dir assets --pattern 'octoshield-assets-*.tar.gz' --pattern SHA256SUMS-assets
          (cd packages && sha256sum --check SHA256SUMS-ubuntu*)
          (cd assets && sha256sum --check SHA256SUMS-assets)
          tar -C assets -xzf "assets/octoshield-assets-${RELEASE_TAG#v}.tar.gz"
          (cd assets/release-assets && sha256sum --check SHA256SUMS)
          jq -e --arg commit "$(git rev-parse HEAD)" --arg version "${RELEASE_TAG#v}" \
            '.source.commit == $commit and .version == $version' assets/release-assets/manifest.json
      - name: Build and verify signed update repository
        if: steps.configuration.outputs.configured == 'true'
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_PASSPHRASE: ${{ secrets.APT_SIGNING_PASSPHRASE }}
          APT_SIGNING_KEY_FINGERPRINT: ${{ vars.APT_SIGNING_KEY_FINGERPRINT }}
          APT_REPOSITORY_URL: ${{ vars.APT_REPOSITORY_URL }}
        run: |
          bash scripts/apt-repository.sh --input packages --assets assets/release-assets --output apt-public
          test -f apt-public/dists/noble/InRelease
          test -f apt-public/dists/resolute/InRelease
          test ! -e apt-public/UNSIGNED-TEST-ONLY
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        if: steps.configuration.outputs.configured == 'true'
        with:
          path: apt-public
      - name: Publish authenticated APT repository
        id: deployment
        if: steps.configuration.outputs.configured == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
