name: Test and lint

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Ubuntu ${{ matrix.ubuntu }}
    runs-on: ubuntu-24.04
    container: ubuntu:${{ matrix.ubuntu }}
    strategy:
      fail-fast: false
      matrix:
        ubuntu: ['24.04', '26.04']
    timeout-minutes: 15
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates git build-essential shellcheck shfmt bats jq util-linux
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Lint, compile and run isolated tests
        run: make check
      - name: Check C memory and undefined behavior
        run: make sanitize
      - name: Run user-session fixtures without root
        run: |
          useradd --create-home octoshield-test
          chmod -R a+rX "$GITHUB_WORKSPACE"
          runuser -u octoshield-test -- bats tests/desktop.bats
