name: Diagnose native refresh transition

on:
  push:
    branches: [fix/1.3.4-access-refresh-release]
    paths: [.github/workflows/diagnose-refresh-1.3.4.yml]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install native debugging dependencies
        run: |
          sudo apt-get update > /tmp/octoshield-apt.log 2>&1 || { cat /tmp/octoshield-apt.log; exit 1; }
          sudo apt-get install --yes --no-install-recommends build-essential gdb pkg-config libgtk-4-dev libadwaita-1-dev libjson-glib-dev xvfb xauth dbus-daemon adwaita-icon-theme librsvg2-common >> /tmp/octoshield-apt.log 2>&1 || { cat /tmp/octoshield-apt.log; exit 1; }
      - name: Compile production frontend tests with symbols
        run: make CFLAGS='-O2 -g' build/test-ui-app
      - name: Repeat mapped normal-speed suite and trace any failure
        run: |
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern=/tmp/octoshield-test.core
          for attempt in 1 2 3; do
            if dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo OCTOSHIELD_TEST_SCREENSHOTS=1 build/test-ui-app > /tmp/full-trace.log 2>&1; then
              tail -n 12 /tmp/full-trace.log
              echo "Normal-speed suite $attempt passed"
            else
              tail -n 35 /tmp/full-trace.log
              if test -f /tmp/octoshield-test.core; then gdb -batch -ex 'set pagination off' -ex bt build/test-ui-app /tmp/octoshield-test.core; fi
              exit 1
            fi
          done
