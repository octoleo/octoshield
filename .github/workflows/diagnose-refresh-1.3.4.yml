name: Validate native refresh transition fix

on:
  push:
    branches: [fix/1.3.4-access-refresh-release]
    paths: [.github/workflows/diagnose-refresh-1.3.4.yml]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.repository == 'octoleo/octoshield' && github.ref == 'refs/heads/fix/1.3.4-access-refresh-release'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install native debugging dependencies
        run: |
          sudo apt-get update > /tmp/octoshield-apt.log 2>&1 || { cat /tmp/octoshield-apt.log; exit 1; }
          sudo apt-get install --yes --no-install-recommends build-essential gdb pkg-config libgtk-4-dev libadwaita-1-dev libjson-glib-dev xvfb xauth dbus-daemon adwaita-icon-theme librsvg2-common >> /tmp/octoshield-apt.log 2>&1 || { cat /tmp/octoshield-apt.log; exit 1; }
      - name: Apply checked source and regression edits
        run: |
          python3 - <<'PY'
          from pathlib import Path
          def replace(s, old, new):
              assert s.count(old) == 1, repr(old)
              return s.replace(old, new)
          p = Path('src/ui/octoshield-gtk.c')
          s = p.read_text()
          anchor = 'static void append_log(App *app, const char *text)\n'
          helper = '''/* Follow the output without scheduling a text-view scroll animation. GTK
           * 4.14 can disconnect an uninitialised adjustment animation when an
           * expander unmaps the view immediately after output arrives. Following
           * changed bounds also handles layout occurring after a buffer append. */
          static void log_bounds_changed(GtkAdjustment *adjustment, gpointer data)
          {
              if (!gtk_widget_get_mapped(GTK_WIDGET(data))) return;
              gtk_adjustment_set_value(adjustment,
                  MAX(gtk_adjustment_get_lower(adjustment),
                      gtk_adjustment_get_upper(adjustment) - gtk_adjustment_get_page_size(adjustment)));
          }

          static void log_view_mapped(GtkWidget *view, gpointer data)
          {
              (void)data;
              log_bounds_changed(gtk_scrollable_get_vadjustment(GTK_SCROLLABLE(view)), view);
          }

          '''
          s = replace(s, anchor, helper + anchor)
          s = replace(s, '    gtk_text_buffer_get_end_iter(app->log, &end);\n    gtk_text_view_scroll_to_iter(app->log_view, &end, 0.0, FALSE, 0.0, 1.0);', '    log_bounds_changed(gtk_scrollable_get_vadjustment(GTK_SCROLLABLE(app->log_view)), app->log_view);')
          anchor = '    gtk_scrolled_window_set_child(GTK_SCROLLED_WINDOW(scroll), GTK_WIDGET(app->log_view));\n'
          s = replace(s, anchor, anchor + '''    g_signal_connect_object(gtk_scrollable_get_vadjustment(GTK_SCROLLABLE(app->log_view)),
                  "changed", G_CALLBACK(log_bounds_changed), app->log_view, 0);
              g_signal_connect(app->log_view, "map", G_CALLBACK(log_view_mapped), NULL);
          ''')
          p.write_text(s)
          p = Path('tests/ui-app-test.c')
          s = p.read_text()
          anchor = 'static void test_refresh_navigation_and_failures(void)\n'
          test = '''static void test_details_immediate_collapse(void)
          {
              g_assert_null(test_app.operation);
              for (guint pass = 0; pass < 4; pass++) {
                  gtk_expander_set_expanded(test_app.details, TRUE);
                  gint64 deadline = g_get_monotonic_time() + 2 * G_TIME_SPAN_SECOND;
                  while (!gtk_widget_get_mapped(GTK_WIDGET(test_app.log_view)) && g_get_monotonic_time() < deadline) {
                      g_main_context_iteration(NULL, FALSE); g_usleep(1000);
                  }
                  g_assert_true(gtk_widget_get_mapped(GTK_WIDGET(test_app.log_view)));
                  for (guint line = 0; line < 80; line++) append_log(&test_app, "Immediate-collapse output fixture");
                  /* No settling sleep: users can collapse immediately, too. */
                  gtk_expander_set_expanded(test_app.details, FALSE);
                  g_assert_false(gtk_expander_get_expanded(test_app.details));
                  while (g_main_context_iteration(NULL, FALSE)) { }
              }
              g_assert_null(test_app.operation);
              g_autofree gchar *text = log_text();
              g_assert_nonnull(strstr(text, "Immediate-collapse output fixture"));
          }

          '''
          s = replace(s, anchor, test + anchor)
          anchor = '    g_test_add_func("/ui/refresh/navigation-inflight-manual-failure-and-session", test_refresh_navigation_and_failures);'
          s = replace(s, anchor, '    g_test_add_func("/ui/refresh/immediate-details-collapse-after-output", test_details_immediate_collapse);\n' + anchor)
          p.write_text(s)
          PY
          git diff --check
      - name: Compile production frontend tests with symbols
        run: make CFLAGS='-O2 -g' gui build/test-ui-app
      - name: Repeat mapped normal-speed suite and trace any failure
        run: |
          ulimit -c unlimited
          sudo sysctl -w kernel.core_pattern=/tmp/octoshield-test.core
          for attempt in 1 2 3; do
            if dbus-run-session -- xvfb-run -a env GTK_A11Y=none GSK_RENDERER=cairo OCTOSHIELD_TEST_SCREENSHOTS=1 build/test-ui-app > /tmp/full-trace.log 2>&1; then
              tail -n 14 /tmp/full-trace.log
              echo "Normal-speed suite $attempt passed"
            else
              tail -n 35 /tmp/full-trace.log
              if test -f /tmp/octoshield-test.core; then gdb -batch -ex 'set pagination off' -ex bt build/test-ui-app /tmp/octoshield-test.core; fi
              exit 1
            fi
          done
      - name: Commit validated source changes only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ui/octoshield-gtk.c tests/ui-app-test.c
          git commit -m 'fix: follow live log output without unsafe collapse-time scrolling'
          git push origin HEAD:fix/1.3.4-access-refresh-release
